events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    upstream sam_api_host {
        server host.docker.internal:3000;
    }

    upstream static_files {
        server static:8080;
    }

    server {
        listen 80;
        server_name localhost;

        # Route /prod/calculate-salary to SAM Local (strip /prod prefix)
        location /prod/calculate-salary {
            proxy_pass http://sam_api_host/calculate-salary;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route /calculate-salary to SAM Local running on host (direct access)
        location /calculate-salary {
            proxy_pass http://sam_api_host;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Route everything else to static file server
        location / {
            proxy_pass http://static_files;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}